<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <link rel="icon" type="image/png" href="/localstream.png" />
  <script>
    (function() {
      try {
        var serverUrl = localStorage.getItem('localstream_server_url');
        if (serverUrl) {
          sessionStorage.setItem('spa_redirect', window.location.pathname + window.location.search + window.location.hash);
          window.location.replace('/');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle 600px at 50% 50%, rgba(59, 130, 246, 0.3), transparent 60%),
        #050816;
      color: #f9fafb;
      overscroll-behavior-y: none;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1.5rem 4rem;
    }
    .page.page-not-found {
      align-items: center;
    }
    .card {
      background: #0f172a;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.9);
    }
    .not-found-card {
      text-align: center;
      max-width: 560px;
    }
    .not-found-sign {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .not-found-code {
      margin: 0;
      font-size: 4.5rem;
      letter-spacing: 0.2rem;
      color: #38bdf8;
      text-shadow: 0 10px 40px rgba(56, 189, 248, 0.35);
    }
    .not-found-title {
      margin: 0.6rem 0 0.75rem;
      font-size: 1.4rem;
    }
    .not-found-copy {
      margin: 0 0 1.75rem;
      color: #9ca3af;
      line-height: 1.5;
    }
    .not-found-actions {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .button-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.75rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      background: #22c55e;
      color: #022c22;
      text-decoration: none;
      transition: transform 0.05s ease, box-shadow 0.1s ease, background 0.1s ease;
    }
    .button-link:hover {
      background: #16a34a;
      box-shadow: 0 10px 20px rgba(22, 163, 74, 0.4);
      transform: translateY(-1px);
    }
    .button-link:active {
      transform: translateY(0);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main class="page page-not-found">
    <section class="card not-found-card">
      <div class="not-found-sign">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="36,8 68,64 4,64" fill="#FFC72C" stroke="#F59E42" stroke-width="3"/>
          <rect x="33" y="28" width="6" height="18" rx="3" fill="#181C2A"/>
          <rect x="33" y="50" width="6" height="6" rx="3" fill="#181C2A"/>
        </svg>
      </div>
      <p class="not-found-code">404</p>
      <h1 class="not-found-title">Page not found</h1>
      <p class="not-found-copy">
        The connection was closed or the page no longer exists. Head back to the
        landing page to reconnect to your LocalStream server.
      </p>
      <div class="not-found-actions">
        <a class="button-link" href="/">Back</a>
      </div>
    </section>
  </main>
</body>
</html>
