<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <link rel="icon" type="image/png" href="/localstream.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page page-not-found">
    <section class="card not-found-card">
      <div class="not-found-sign">
        <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="36,8 68,64 4,64" fill="#FFC72C" stroke="#F59E42" stroke-width="3"/>
          <rect x="33" y="28" width="6" height="18" rx="3" fill="#181C2A"/>
          <rect x="33" y="50" width="6" height="6" rx="3" fill="#181C2A"/>
        </svg>
      </div>
      <p class="not-found-code">404</p>
      <h1 class="not-found-title">Page not found</h1>
      <p class="not-found-copy">
        The connection was closed or the page no longer exists. Head back to the
        landing page to reconnect to your LocalStream server.
      </p>
      <div class="not-found-actions">
        <a class="button-link" href="http://lsclient.qzz.io">Back</a>
      </div>
    </section>
  </main>
</body>
</html>
